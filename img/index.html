<style>
/* Photo-led. One serif for voice, one grotesk for function. Columns keep every frame at its own proportion. */
:root{
  --bg:#0c0d0f; --fg:#ece9e2; --muted:#8b8e94; --line:#22252b; --accent:#c9b98f;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --gutter:clamp(16px,4vw,56px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#efeee9; --fg:#121315; --muted:#63666c; --line:#d6d4cc; --accent:#7a6a3f; color-scheme:light; }
}
:root[data-theme="light"]{ --bg:#efeee9; --fg:#121315; --muted:#63666c; --line:#d6d4cc; --accent:#7a6a3f; color-scheme:light; }

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1600px;margin:0 auto;padding:0 var(--gutter)}

/* Header */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px 28px;padding-top:18px;padding-bottom:14px}
.brand{font-family:var(--serif);font-size:28px;line-height:1;text-decoration:none}
header nav{display:flex;flex-wrap:wrap;gap:6px 22px}
header nav a{font-size:14px;text-decoration:none;color:var(--muted);padding-block:4px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
header nav a:hover,header nav a:focus-visible{color:var(--fg);border-color:var(--fg);outline:none}

/* Hero: the photograph is the first thing seen */
.hero{position:relative;height:min(88vh,820px);min-height:420px;overflow:hidden;background:var(--line)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,0) 55%)}
.hero-text{position:absolute;left:0;right:0;bottom:0;z-index:1;color:#f4f2ec}
.hero-text .wrap{padding-bottom:clamp(28px,5vw,64px)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(64px,13vw,184px);line-height:.88;letter-spacing:-.02em;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero p{margin-top:18px;max-width:44ch;color:#d9d6cf;font-size:clamp(15px,1.4vw,18px)}
.hero a.follow{display:inline-block;margin-top:22px;font-size:14px;color:#f4f2ec;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.hero a.follow:hover,.hero a.follow:focus-visible{color:var(--accent);outline:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Sections */
section{padding-top:clamp(64px,9vw,128px)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:clamp(20px,3vw,36px);padding-bottom:14px;border-bottom:1px solid var(--line)}
.sec-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,76px);line-height:1;letter-spacing:-.01em}

/* Gallery: masonry by columns, every frame keeps its own orientation */
.gallery{columns:1;column-gap:14px}
@media (min-width:640px){ .gallery{columns:2} }
@media (min-width:1040px){ .gallery{columns:3;column-gap:18px} }
.gallery button{all:unset;display:block;width:100%;margin:0 0 14px;break-inside:avoid;cursor:zoom-in;background:var(--line)}
@media (min-width:1040px){ .gallery button{margin-bottom:18px} }
.gallery img{display:block;width:100%;height:auto;transition:opacity .4s ease}
.gallery button:hover img{opacity:.9}
.gallery button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Footer */
footer{margin-top:clamp(72px,10vw,140px);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:28px;padding-bottom:48px;color:var(--muted);font-size:14px}
footer a{text-decoration:none}
footer a:hover,footer a:focus-visible{color:var(--fg)}

/* Lightbox */
#lb{position:fixed;inset:0;background:rgba(6,7,8,.96);display:none;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px);z-index:50}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:84vh;object-fit:contain}
#lb .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#b9b7b1;font-size:14px;letter-spacing:.02em}
#lb button{all:unset;position:absolute;color:#e6e4df;font-size:36px;line-height:1;cursor:pointer;padding:12px 16px;font-family:var(--sans)}
#lb button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#lb .x{top:4px;right:4px}
#lb .p{left:0;top:50%;transform:translateY(-50%)}
#lb .n{right:0;top:50%;transform:translateY(-50%)}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .hero h1{animation:none}
  .gallery img,header nav a{transition:none}
}
</style>

<div id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="x" aria-label="Close">×</button>
  <button class="p" aria-label="Previous">‹</button>
  <img alt="">
  <button class="n" aria-label="Next">›</button>
  <div class="cap"></div>
</div>

<script>
(function(){
  var items = Array.prototype.slice.call(document.querySelectorAll('.gallery button'));
  var lb = document.getElementById('lb');
  var limg = lb.querySelector('img');
  var cap = lb.querySelector('.cap');
  var idx = 0;
  function show(i){
    idx = (i + items.length) % items.length;
    var b = items[idx];
    limg.src = b.getAttribute('data-src');
    limg.alt = b.querySelector('img').alt;
    cap.textContent = b.getAttribute('data-cap') || '';
  }
  function open(i){ show(i); lb.classList.add('open'); lb.querySelector('.x').focus(); }
  function close(){ lb.classList.remove('open'); limg.removeAttribute('src'); }
  items.forEach(function(b, i){ b.addEventListener('click', function(){ open(i); }); });
  lb.querySelector('.x').addEventListener('click', close);
  lb.querySelector('.p').addEventListener('click', function(e){ e.stopPropagation(); show(idx - 1); });
  lb.querySelector('.n').addEventListener('click', function(e){ e.stopPropagation(); show(idx + 1); });
  lb.addEventListener('click', function(e){ if (e.target === lb) close(); });
  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(idx - 1);
    if (e.key === 'ArrowRight') show(idx + 1);
  });
  var sx = null;
  lb.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', function(e){
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 40) show(dx < 0 ? idx + 1 : idx - 1);
    sx = null;
  });
})();
</script>
